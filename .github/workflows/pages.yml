name: Build and deploy LVSN to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "lvsn-portfolio-source.zip"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "lvsn-portfolio-source.zip"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source_ready: ${{ steps.source.outputs.ready }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check for the sanitized source archive
        id: source
        shell: bash
        run: |
          if [ -f lvsn-portfolio-source.zip ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Source archive not uploaded yet; waiting for lvsn-portfolio-source.zip."
          fi

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.source_ready == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract the sanitized website source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site-src
          mkdir -p site-src
          unzip -q lvsn-portfolio-source.zip -d site-src
          find site-src -maxdepth 1 -type f -name '.env*' ! -name '.env.example' -delete
          mkdir -p site-src/public
          for folder in photos About_me Vids; do
            if [ -d "$folder" ]; then
              mkdir -p "site-src/public/$folder"
              cp -a "$folder"/. "site-src/public/$folder"/
            fi
          done
          touch site-src/public/.nojekyll

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-src/package-lock.json

      - name: Install dependencies
        working-directory: site-src
        run: npm ci

      - name: Build static website
        working-directory: site-src
        env:
          GITHUB_PAGES: "true"
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-src/dist

  deploy:
    if: ${{ github.event_name != 'pull_request' && needs.prepare.outputs.source_ready == 'true' && needs.build.result == 'success' }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
